name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev tooling (ruff)
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make unit
